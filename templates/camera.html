<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 촬영 및 랭킹</title>
    <style>
        body {
            margin: 0;
            padding: 20px 15px;
            text-align: center;
            font-family: sans-serif;
            background: #f5f5f5;
        }
        h1 { margin-bottom: 5px; }
        .username {
            font-size: 17px;
            color: #555;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #222;
            color: white;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin: 5px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-capture {
            background: #e53e3e;
            display: none;
        }
        #video-container {
            margin: 15px auto;
            max-width: 420px;
        }
        #video, #preview {
            width: 100%;
            max-height: 380px;
            border-radius: 15px;
            background: #000;
            object-fit: cover;
            display: none;
        }
        #canvas { display: none; }

        /* 결과 카드 */
        #result-box {
            display: none;
            margin: 20px auto;
            max-width: 420px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .badge {
            display: inline-block;
            background: #FFE8E5;
            color: #FF5252;
            font-size: 13px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        .price {
            font-size: 32px;
            font-weight: 900;
            color: #e53e3e;
            margin: 8px 0;
        }
        .reason {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
        }
        #loading {
            display: none;
            font-size: 17px;
            font-weight: bold;
            color: #222;
            margin: 15px 0;
        }

        /* 🏆 랭킹 섹션 */
        .ranking-container {
            margin: 35px auto 20px auto;
            max-width: 440px;
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            text-align: left;
        }
        .ranking-title {
            font-size: 18px;
            font-weight: 800;
            color: #222;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }
        .ranking-item:last-child { border-bottom: none; }
        .rank-badge {
            width: 24px;
            font-weight: bold;
            color: #777;
        }
        .rank-1 { color: #f59e0b; font-size: 16px; }
        .rank-2 { color: #94a3b8; font-size: 15px; }
        .rank-3 { color: #b45309; font-size: 15px; }
        .rank-info { flex: 1; margin: 0 10px; }
        .rank-user { font-weight: bold; color: #333; }
        .rank-name { font-size: 12px; color: #888; }
        .rank-price { font-weight: 800; color: #e53e3e; }
    </style>
</head>
<body>
    <h1>📷 사진 촬영</h1>
    <div class="username">접속 아이디: <b id="current-user">{{ username }}</b></div>

    <div>
        <button id="btn-start" class="btn" onclick="startCamera()">📷 카메라 켜기</button>
        <button id="btn-snap" class="btn btn-capture" onclick="takeSnapshot()">📸 찰칵! 촬영하기</button>
    </div>

    <div id="loading">⚡ AI가 순식간에 감정하고 랭킹 등록 중...</div>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview">
    </div>

    <canvas id="canvas"></canvas>

    <!-- 내 측정 결과 -->
    <div id="result-box">
        <span class="badge" id="res-tag">#감정완료</span>
        <div class="item-name" id="res-name">식별 대상</div>
        <div class="price" id="res-price">0원</div>
        <div class="reason" id="res-reason">이유</div>
    </div>

    <!-- 🏆 명예의 전당 (실시간 랭킹) -->
    <div class="ranking-container">
        <div class="ranking-title">
            <span>🏆 실시간 몸값 TOP 10</span>
            <button onclick="loadRankings()" style="background:none; border:none; cursor:pointer; font-size:13px; color:#666;">🔄 새로고침</button>
        </div>
        <ul class="ranking-list" id="ranking-list">
            <li style="text-align:center; padding:15px; color:#999;">랭킹 불러오는 중...</li>
        </ul>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const preview = document.getElementById("preview");
        const btnStart = document.getElementById("btn-start");
        const btnSnap = document.getElementById("btn-snap");
        const loading = document.getElementById("loading");
        const resultBox = document.getElementById("result-box");
        const username = document.getElementById("current-user").innerText;
        let stream = null;

        // 페이지 열릴 때 랭킹 바로 로드
        window.onload = loadRankings;

        async function loadRankings() {
            try {
                const res = await fetch("/api/rankings");
                const list = await res.json();
                const container = document.getElementById("ranking-list");
                
                if (list.length === 0) {
                    container.innerHTML = '<li style="text-align:center; padding:15px; color:#999;">아직 등록된 랭킹이 없습니다.</li>';
                    return;
                }

                container.innerHTML = list.map(item => `
                    <li class="ranking-item">
                        <span class="rank-badge ${item.rank <= 3 ? 'rank-' + item.rank : ''}">${item.rank}</span>
                        <div class="rank-info">
                            <span class="rank-user">${item.username}</span>
                            <span class="rank-name">(${item.name})</span>
                        </div>
                        <span class="rank-price">${item.price}</span>
                    </li>
                `).join('');
            } catch (e) {
                console.error("랭킹 로드 실패:", e);
            }
        }

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("카메라 권한을 얻을 수 없습니다. 보안 컨텍스트(HTTPS 또는 localhost)에서 실행해주세요.");
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                video.style.display = "block";
                preview.style.display = "none";
                resultBox.style.display = "none";
                btnStart.style.display = "none";
                btnSnap.style.display = "inline-block";
            } catch (err) {
                alert("카메라 연결 실패: " + err.message);
            }
        }

        function takeSnapshot() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            preview.src = canvas.toDataURL("image/jpeg");
            preview.style.display = "block";
            video.style.display = "none";
            btnSnap.style.display = "none";
            btnStart.style.display = "inline-block";
            btnStart.innerText = "🔄 다시 찍기";

            if (stream) stream.getTracks().forEach(track => track.stop());

            loading.style.display = "block";
            resultBox.style.display = "none";

            canvas.toBlob(async function(blob) {
                const formData = new FormData();
                formData.append("username", username);
                formData.append("file", blob, "photo.jpg");

                try {
                    const response = await fetch("/evaluate", {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    loading.style.display = "none";

                    if (response.ok) {
                        document.getElementById("res-tag").innerText = "#" + data.tag;
                        document.getElementById("res-name").innerText = data.name;
                        document.getElementById("res-price").innerText = data.price;
                        document.getElementById("res-reason").innerText = "💬 " + data.reason;
                        resultBox.style.display = "block";

                        // 랭킹 목록 자동 갱신
                        loadRankings();
                    } else {
                        alert("분석 실패: " + (data.detail || "오류 발생"));
                    }
                } catch (e) {
                    loading.style.display = "none";
                    alert("서버 연결 실패");
                }
            }, "image/jpeg", 0.85);
        }
    </script>
</body>
</html>
