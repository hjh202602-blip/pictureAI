<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 촬영</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            text-align: center;
            font-family: sans-serif;
            background: #f5f5f5;
        }
        h1 { margin-bottom: 5px; }
        .username {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 32px;
            background: #222;
            color: white;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin: 5px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-capture {
            background: #e53e3e;
            display: none;
        }
        #video-container {
            margin: 20px auto;
            max-width: 450px;
        }
        #video, #preview {
            width: 100%;
            max-height: 420px;
            border-radius: 15px;
            background: #000;
            object-fit: cover;
            display: none;
        }
        #canvas { display: none; }
        #result-box {
            display: none;
            margin: 25px auto;
            max-width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #eee;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }
        .price {
            font-size: 32px;
            font-weight: 900;
            color: #e53e3e;
            margin: 10px 0;
        }
        .reason {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
        }
        #loading {
            display: none;
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>📷 사진 촬영</h1>
    <div class="username">아이디: <b>{{ username }}</b></div>

    <div>
        <button id="btn-start" class="btn" onclick="startCamera()">📷 카메라 켜기</button>
        <button id="btn-snap" class="btn btn-capture" onclick="takeSnapshot()">📸 찰칵! 촬영하기</button>
    </div>

    <div id="loading">⚡ AI가 순식간에 감정 중...</div>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview">
    </div>

    <canvas id="canvas"></canvas>

    <div id="result-box">
        <span class="badge" id="res-tag">#감정완료</span>
        <div class="item-name" id="res-name">식별 대상</div>
        <div class="price" id="res-price">0원</div>
        <div class="reason" id="res-reason">이유</div>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const preview = document.getElementById("preview");
        const btnStart = document.getElementById("btn-start");
        const btnSnap = document.getElementById("btn-snap");
        const loading = document.getElementById("loading");
        const resultBox = document.getElementById("result-box");
        let stream = null;

        async function startCamera() {
            // 브라우저의 카메라 지원 여부 및 보안 컨텍스트 확인
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("브라우저 보안 정책으로 카메라를 열 수 없습니다.\n반드시 http://localhost:8000 으로 접속했는지 확인하세요.");
                return;
            }

            try {
                // 범용 웹캠/모바일 카메라 요청
                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                video.srcObject = stream;
                video.style.display = "block";
                preview.style.display = "none";
                resultBox.style.display = "none";

                btnStart.style.display = "none";
                btnSnap.style.display = "inline-block";
            } catch (err) {
                alert("카메라 연결 실패: " + err.name + " - " + err.message + "\n다른 프로그램에서 카메라를 사용 중인지 확인해주세요.");
            }
        }

        function takeSnapshot() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            preview.src = canvas.toDataURL("image/jpeg");
            preview.style.display = "block";
            video.style.display = "none";
            btnSnap.style.display = "none";
            btnStart.style.display = "inline-block";
            btnStart.innerText = "🔄 다시 찍기";

            // 카메라 정지
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            loading.style.display = "block";
            resultBox.style.display = "none";

            // 서버로 이미지 전송
            canvas.toBlob(async function(blob) {
                const formData = new FormData();
                formData.append("file", blob, "photo.jpg");

                try {
                    const response = await fetch("/evaluate", {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    loading.style.display = "none";

                    if (response.ok) {
                        document.getElementById("res-tag").innerText = "#" + data.tag;
                        document.getElementById("res-name").innerText = data.name;
                        document.getElementById("res-price").innerText = data.price;
                        document.getElementById("res-reason").innerText = "💬 " + data.reason;
                        resultBox.style.display = "block";
                    } else {
                        alert("분석 실패: " + (data.detail || "오류"));
                    }
                } catch (e) {
                    loading.style.display = "none";
                    alert("서버 연결 실패");
                }
            }, "image/jpeg", 0.85);
        }
    </script>
</body>
</html>
