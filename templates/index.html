<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 입력</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            text-align: center;
            font-family: sans-serif;
            background: #f5f5f5;
        }
        h1 {
            margin-top: 80px;
            margin-bottom: 40px;
        }
        input {
            width: 80%;
            max-width: 400px;
            padding: 15px;
            font-size: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            cursor: pointer;
        }
        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <h1>👤 아이디를 입력하세요</h1>
    <form method="POST" action="/start">
        <input
            type="text"
            name="username"
            placeholder="아이디 입력"
            maxlength="20"
            required
            autocomplete="off"
        >
        <br>
        <button type="submit">시작하기</button>
    </form>
</body>
</html>
